<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flightgame · what is in what</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈</text></svg>">
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --ink: #1b1f24; --muted: #667085; --line: #e4e7ec;
  --done: #12a150; --done-bg: #e3f6ea; --doing: #c98a00; --doing-bg: #fff3cc;
  --no: #98a2b3; --no-bg: #f2f4f7; --accent: #2f6fde;
  --web: #2f6fde; --fly: #8a4fd8; --rust: #d0571f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --panel: #171b21; --ink: #e7eaee; --muted: #8b95a3; --line: #262c35;
    --done: #3ccf7a; --done-bg: #12301f; --doing: #f2c14e; --doing-bg: #3a2f10;
    --no: #5d6674; --no-bg: #1d222a; --accent: #6b9cff;
    --web: #6b9cff; --fly: #b48af0; --rust: #f08a55;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 18px 60px; }
header h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; }
header p { margin: 4px 0 0; color: var(--muted); }
.apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 20px 0 26px; }
.app { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  border-top: 4px solid var(--c); }
.app h2 { margin: 0 0 2px; font-size: 17px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.app h2 small { font-weight: 500; font-size: 12px; color: var(--muted); }
.app .meta { color: var(--muted); font-size: 13px; }
.app .bar { height: 8px; border-radius: 4px; background: var(--no-bg); overflow: hidden; display: flex; margin: 10px 0 6px; }
.app .bar i { display: block; height: 100%; }
.app .links { font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
section { margin-top: 30px; }
section > h2 { font-size: 19px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
section > h2 small { font-size: 13px; color: var(--muted); font-weight: 500; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
  padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
input[type=search] { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px;
  padding: 6px 10px; font: inherit; font-size: 14px; min-width: 200px; flex: 1; max-width: 320px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
thead th { cursor: pointer; user-select: none; }
thead th:hover { color: var(--accent); }
thead th .arrow { font-size: 11px; color: var(--muted); }
td .grp { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
thead th { position: sticky; top: 0; background: var(--panel); font-size: 13px; z-index: 1; }
th.c, td.c { text-align: center; width: 104px; }
thead th.c { color: var(--c); }
thead th.c small { display: block; color: var(--muted); font-weight: 500; }
tr.group td { background: var(--no-bg); font-weight: 650; font-size: 13px; text-transform: uppercase;
  letter-spacing: .04em; color: var(--muted); }
tbody tr:last-child td { border-bottom: 0; }
td .note { display: block; color: var(--muted); font-size: 12px; }
.s { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 28px;
  border-radius: 8px; font-weight: 700; font-size: 15px; padding: 0 8px; cursor: default; }
.s.done { background: var(--done-bg); color: var(--done); }
.s.doing { background: var(--doing-bg); color: var(--doing); font-size: 12px; gap: 5px; }
.s.doing::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--doing);
  animation: pulse 1.6s ease-in-out infinite; }
.s.no { color: var(--no); background: transparent; border: 1px dashed var(--line); }
.s.na { color: var(--no); opacity: .5; background: transparent; font-weight: 400; }
.s.unknown { color: var(--no); background: var(--no-bg); }
@keyframes pulse { 50% { opacity: .3; } }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c);
  border-radius: 10px; padding: 10px 14px; }
.card b { font-size: 14px; }
.card .meta, .muted { color: var(--muted); font-size: 13px; }
.card code, td code { font-size: 12px; background: var(--no-bg); padding: 1px 5px; border-radius: 4px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
  color: #fff; background: var(--c); vertical-align: 1px; }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.list .row { display: flex; gap: 10px; padding: 7px 14px; border-bottom: 1px solid var(--line); align-items: baseline; }
.list .row:last-child { border-bottom: 0; }
.list .day { padding: 8px 14px 4px; font-weight: 650; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--no-bg); }
.list .msg { flex: 1; min-width: 0; }
.list .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
details summary { cursor: pointer; color: var(--muted); font-size: 14px; margin: 8px 0; }
.empty { color: var(--muted); padding: 14px; }
footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
@media (max-width: 640px) {
  th.c, td.c { width: 58px; padding: 6px 4px; }
  thead th.c small { display: none; }
  .s.doing span { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✈ Flightgame: what is in what</h1>
    <p>Which app has which feature. Click a column to sort.</p>
  </header>

  <div class="apps" id="apps"></div>

  <section id="features">
    <h2>Features <small>which app has which feature</small></h2>
    <div class="legend">
      <span><b class="s done">✓</b> done</span>
      <span><b class="s doing"><span>working</span></b> being worked on</span>
      <span><b class="s no">—</b> not there yet</span>
      <span><b class="s na">n/a</b> not needed there</span>
      <span><b class="s unknown">?</b> not checked</span>
    </div>
    <div class="tools" id="filters"></div>
    <table id="matrix"></table>
  </section>

  <footer>Edit the list in <a href="https://github.com/noname-ch/flightgame-hub/blob/main/board.json"><code>board.json</code></a> and push; the page updates in a minute.</footer>
</div>

<script src="app.js"></script>
</body>
</html>
